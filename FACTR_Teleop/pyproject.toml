[tool.poetry]
name = "factr_fastapi"
version = "0.2.0"
description = "FastAPI wrapper for FACTR's ROS2 setup"
authors = ["Leo Wang <leowang657@gmail.com>"]

packages = [
    {include = "factr_fastapi"},
]

[tool.poetry.dependencies]
python = "~3.10, <=3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.23.1"}
pydantic = {extras = ["email"], version = "^2.4.2"}
numpy = "^1.26.1"
loguru = "^0.7.2"

[tool.poetry.scripts]
print_publisher = "factr_fastapi.factr_fastapi.factr_api:main"

[tool.poetry.group.test.dependencies]
nox = "^2023.4.22"


[tool.poetry.group.dev.dependencies]
ruff = "^0.1.6"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core>=1.3.2"]
build-backend = "poetry.core.masonry.api"