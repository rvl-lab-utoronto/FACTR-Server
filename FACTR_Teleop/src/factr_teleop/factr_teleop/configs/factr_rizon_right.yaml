name: right

dynamixel_small:
  # USB port name given by the command: ls /dev/serial/by-id/
  dynamixel_port: "usb-FTDI_USB__-__Serial_Converter_FTAA0B2I-if00-port0" # edited on Jun 17
  # Dynamixel IDs wired to the small board (order that readings/commands are indexed)
  ids: [1, 3, 5, 6, 7, 8]
  # Servo types, one per id (same order as ids)
  servo_types: ["XC330_T288_T", "XC330_T288_T", "XC330_T288_T", "XC330_T288_T", "XC330_T288_T", "XC330_T288_T"]
  # Joint directions to match the leader arm, one per id (same order as ids)
  joint_signs: [1, 1, 1, 1, 1, 1]

dynamixel_big:
  # USB port name given by the command: ls /dev/serial/by-id/
  dynamixel_port: "usb-FTDI_USB__-__Serial_Converter_FTA2U2FX-if00-port0"
  # Dynamixel IDs wired to the big board (order that readings/commands are indexed)
  ids: [2, 4]
  # Servo types, one per id (same order as ids)
  servo_types: ["XM430_W210_T", "XM430_W210_T"]
  # Joint directions to match the leader arm, one per id (same order as ids)
  joint_signs: [1, 1]

arm_teleop:
  # URDF used for creating leader arm dynamics model to compute gravity compensation
  leader_urdf: "flexiv_teleop_pos45_x.urdf" 
  num_arm_joints: 7
  arm_joint_limits_max: [2.8798, 2.3562, 3.0543, 2.7751, 3.0543, 4.6251, 3.0543]
  arm_joint_limits_min: [-2.8798, -2.3562, -3.0543, -1.9548, -3.0543, -1.4835, -3.0543]
  arm_joint_limits_safety_margin: 0.1
  initialization:
    # The expected leader arm joint position before launching the script
    calibration_joint_pos: [0.0, 0.0, 0.0, 1.57, 0.0, 0.0, 0.0]
    # The leader arm must be brought to this joint position before the follower starts mirroring the leader
    initial_match_joint_pos: [0.0, 0.0, 0.0, 1.57, 0.0, 0.0, 0.0]
  
gripper_teleop:
  # The maximum range (in rad) of the leader gripper trigger
  actuation_range: 10

controller:
  frequency: 500
  torque_feedback:
    enable: True
    gain: 3.0
    damping: 0.0
    motor_scalar: 94.5652173913
  gravity_comp:
    enable: True
    gain: 0.65
  null_space_regulation:
    null_space_joint_target: [0.0, -0.7854, 0.0, -2.356, 0.0, 1.57, 0.0, 0.0]
    kp: 0.1
    kd: 0.01
  static_friction_comp:
    enable_speed: 0.9
    gain: 0.6
  joint_limit_barrier:
    kp: 1.03561658022
    kd: 0.04315069084
  joint_position_control:
    interpolation_step_size: 0.5
    kp: 1.03561658022
    kd: 0.04315069084

  gripper_feedback:
    enable: True
    gain: 0.28328611898
    ema_beta: 0.95
