name: left

dynamixel:
  # USB port name given by the command: ls /dev/serial/by-id/
  dynamixel_port: "usb-FTDI_USB__-__Serial_Converter_FTAKRPX7-if00-port0"
  # Servo types
  servo_types: [
    "XM430_W210_T", "XM430_W210_T", "XC330_T288_T", "XM430_W210_T", 
    "XC330_T288_T", "XC330_T288_T", "XC330_T288_T", "XC330_T288_T",
  ]

arm_teleop:
  # URDF used for creating leader arm dynamics model to compute gravity compensation
  leader_urdf: "flexiv_teleop_left.urdf"
  num_arm_joints: 7
  # Follower joint limits, from Rizon4s_synched.urdf (Flexiv Rizon 4s)
  arm_joint_limits_max: [2.8798, 2.3562, 3.0543, 2.7751, 3.0543, 4.6251, 3.0543]
  arm_joint_limits_min: [-2.8798, -2.3562, -3.0543, -1.9548, -3.0543, -1.4835, -3.0543]
  arm_joint_limits_safety_margin: 0.1
  initialization:
    # Authoritative dynamics-model home. DFC measures the physical leader at this
    # target; FACTR derives every zero offset from that capture at launch.
    model_home_q_rad: [0.0, 0.0, 0.0, 1.57, 0.0, 0.0, 0.0]
gripper_teleop:
  # FACTR owns only the gripper's hardware direction; DFC owns all arm signs.
  hardware_sign: 1
  # The maximum range (in rad) of the leader gripper trigger
  actuation_range: 0.8

controller:
  frequency: 500
  torque_feedback:
    # Capability is on for both leaders; the API relay's runtime gate defaults
    # off and is controlled by /enable_force_feedback_left.
    enable: True
    # Physical gain, damping, and motor scalar are injected by DFC.
    # Staleness cutoff [s] and per-joint clip [Nm] for the follower external-torque
    # feed (/factr_force_feedback_<side>): the control loop feeds zeros once the
    # newest sample is older than `timeout`, and each accepted torque is clipped to
    # +-max_torque before use.
    timeout: 0.25
    max_torque: 10.0
  gravity_comp:
    enable: True
    # Physical gain and activation-ramp time are injected by DFC.
  null_space_regulation:
    enable: true
    # Disabled startup fallback; managed collection replaces it with task.start_qpos.
    # Gain-ramp time and PD gains are injected by DFC.
  static_friction_comp:
    enable_speed: 10
    # Gain is injected by DFC.
  joint_limit_barrier:
    # Disabled: no leader-side end-stop repulsion (no follower-range protection from FACTR).
    enable: false
    # PD gains are injected by DFC.
  joint_position_control:
    interpolation_step_size: 0.5
    # PD gains are injected by DFC.

  gripper_spring:
    enable: True
    # Stiffness, damping, and maximum torque are injected by DFC.
